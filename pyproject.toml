[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-api-buddy"
version = "0.5.1"
description = "HTTP caching proxy module for development environments with reference APIs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Reference API Buddy Team", email = "tinkermonkey25@gmail.com"}
]
maintainers = [
    {name = "Reference API Buddy Team", email = "tinkermonkey25@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
keywords = ["proxy", "caching", "api", "http", "development", "rate-limiting"]
requires-python = ">=3.10"
# The package uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4",
    "requests>=2.34",
    "black>=26.0",
    "isort>=9.0",
    "flake8>=7.4",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "autopep8>=2.3.2",
    "build>=1.6",
    "coverage>=7.16",
    "twine>=7.0",
    "typing-extensions>=4.16",
    "pip-audit>=2.10",
]
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.1",
    "myst-parser>=4.0",
]

[project.urls]
Homepage = "https://github.com/tinkermonkey/reference-api-buddy"
Repository = "https://github.com/tinkermonkey/reference-api-buddy"
Issues = "https://github.com/tinkermonkey/reference-api-buddy/issues"
Changelog = "https://github.com/tinkermonkey/reference-api-buddy/blob/main/CHANGELOG.md"

[project.scripts]
api-buddy = "reference_api_buddy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reference_api_buddy*"]
exclude = ["tests*", "docs*", "build*"]

[tool.coverage.run]
source = ["reference_api_buddy"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
