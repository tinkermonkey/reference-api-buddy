  name: Secure Key Placement Gaps
  description: "Checked against 0.5.2 with a running proxy: the X-API-Buddy-Key
    header and Authorization Bearer placements work, but a key in the path
    prefix gets 404 'Domain not mapped' (domain matching uses the raw path, not
    the path with the key stripped) and a ?key= query parameter gets 500
    (parse_qs yields a list, which validate_request cannot encode). The header
    key is also forwarded to the upstream with the other request headers."
  attributes:
    assessmentType: gap
  source_reference:
    provenance: manual
