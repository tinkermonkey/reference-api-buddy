    type: countermeasure
    layer_id: security
    name: Proxy Key Stripped Before Forwarding
    description: "The proxy key never reaches the upstream: a path-prefix or key= placement is removed from the path used for routing, caching and forwarding, and the X-API-Buddy-Key header and an Authorization: Bearer <proxy key> header are not copied upstream. It holds whether or not require_secure_key is on. Since #8 and #10."
