  spec_node_id: motivation.driver
  type: driver
  layer_id: motivation
  name: Upstream Rate Limits And Costs
  description: Upstream reference APIs throttle or block heavy callers and paid
    APIs bill per request, so redundant calls cost money and get pipelines rate
    limited.
  attributes:
    category: business
  metadata:
    created_at: 2026-11-24T17:55:54.499Z
    updated_at: 2026-11-24T17:55:54.499Z
