[pytest]
minversion = 9.0
addopts = -ra -q -m "not network"
python_files = tests/unit_tests/test_*.py tests/integration_tests/test_*.py tests/performance_tests/test_*.py
markers =
    network: calls real external services; deselected by default, run with `pytest -m network`
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
