id: changeset-1795601455978-aks4hgara
name: secure-key-fixes
description: "Record the secure-key fixes from #8 and #10 (0.5.3 unreleased): path-prefix and query keys are stripped before forwarding, the proxy key is never sent upstream (path, query, header or bearer), and a valid proxy key wins among several key= values. Updates the assessment, threat, security scheme and function descriptions that described the old bugs, and adds the new tests. Done when the model describes the fixed behavior and validates clean."
