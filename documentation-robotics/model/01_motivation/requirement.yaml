motivation.requirement.cache-get-and-post-by-request-signature:
  id: ef2cf007-4811-413e-80cb-c9ad7c100466
  path: motivation.requirement.cache-get-and-post-by-request-signature
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Cache GET And POST By Request Signature
  description: GET responses are cached by method plus normalized URL (lower-cased
    scheme and host, sorted query, trailing slash ignored); POST responses also
    key on the request body, JSON bodies normalized with sorted keys and other
    bodies hashed. PUT and DELETE are forwarded without caching. (PATCH has no
    handler, so http.server answers 501.)
  attributes:
    requirementType: functional
    priority: critical
  source_reference:
    provenance: manual
    locations:
      - file: documentation/01_poc/01.1_poc_requirements.md
  metadata:
    created_at: 2026-11-24T17:55:54.501Z
    updated_at: 2026-11-24T17:55:54.501Z
    version: 1
motivation.requirement.persistent-or-in-memory-cache:
  id: 18cd67db-9005-40fb-9e92-50e8c607e000
  path: motivation.requirement.persistent-or-in-memory-cache
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Persistent Or In Memory Cache
  description: cache.database_path selects an on-disk SQLite file, or ':memory:'
    for a shared in-memory SQLite database.
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
