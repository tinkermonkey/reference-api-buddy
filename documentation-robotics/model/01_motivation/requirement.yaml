motivation.requirement.distinguish-upstream-errors-from-outages:
  id: f0e2fc5e-4b57-4535-aafe-83e582a82543
  path: motivation.requirement.distinguish-upstream-errors-from-outages
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Distinguish Upstream Errors From Outages
  description: Upstream HTTP error statuses, bodies and headers pass through to
    the client unchanged; network failures and a mapping with no upstream answer
    502, and an unmapped domain answers 404.
  attributes:
    requirementType: functional
    priority: medium
  source_reference:
    provenance: manual
