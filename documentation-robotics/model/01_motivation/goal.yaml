motivation.goal.drop-in-without-custom-api-clients:
  id: 3fe5e1ed-cc37-43b1-9741-3bd3a8a61219
  path: motivation.goal.drop-in-without-custom-api-clients
  spec_node_id: motivation.goal
  type: goal
  layer_id: motivation
  name: Drop In Without Custom API Clients
  description: Let an application use the proxy by pointing its existing API
    client's base URL at it, either embedded as a Python module or run
    standalone, with no separate HTTP proxy configuration and no disabled TLS
    checks.
  attributes:
    priority: medium
  metadata:
    created_at: 2026-11-24T17:55:54.500Z
    updated_at: 2026-11-24T17:55:54.500Z
