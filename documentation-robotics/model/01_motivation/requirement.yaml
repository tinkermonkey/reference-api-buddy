    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.configurable-cache-ttl:
  id: a1f852a9-a395-4806-9662-ed8406e4e663
  path: motivation.requirement.configurable-cache-ttl
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Configurable Cache TTL
  description: Cache entries expire after cache.default_ttl_seconds (default
    86400) unless the domain mapping sets ttl_seconds; expired entries are
    deleted on read and at startup.
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
      - file: documentation/02_ttl_config/02.1_ttl_config_requirements.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.cache-only-successful-responses:
  id: f6a846c8-0e50-4006-80a6-38e42500f730
  path: motivation.requirement.cache-only-successful-responses
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Cache Only Successful Responses
  description: Only 2xx responses are cached, so upstream errors, 429s and
    replayed 304s are never served for a whole TTL.
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
      - file: CHANGELOG.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.bounded-cache-size:
  id: 7dd29e01-9dfe-4497-b460-ee24dab02be1
  path: motivation.requirement.bounded-cache-size
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Bounded Cache Size
  description: The cache holds at most cache.max_cache_entries entries (default
    1000), evicting least recently accessed entries, and skips responses over
    cache.max_cache_response_size (default 10 MB); bodies over 1 KB are
    zlib-compressed.
  attributes:
    requirementType: non-functional
    priority: medium
  source_reference:
    provenance: manual
    locations:
      - file: CHANGELOG.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.per-domain-rate-limiting:
  id: 3b805db1-6bcd-4b58-a688-3e7f13d4d1fa
  path: motivation.requirement.per-domain-rate-limiting
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Per Domain Rate Limiting
  description: "Each mapped domain is limited per hour
    (throttling.default_requests_per_hour or domain_limits) and optionally per
    minute and per second (max_requests_per_minute, max_requests_per_second).
    The proxy sleeps to stay inside the limits, and answers 429 with Retry-After
    and X-RateLimit headers when the wait would exceed
    throttling.progressive_max_delay. Only upstream requests count: cache hits
    are never throttled."
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.deduplicate-concurrent-requests:
  id: 09598446-9b79-4896-990f-2014d82ba94a
  path: motivation.requirement.deduplicate-concurrent-requests
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Deduplicate Concurrent Requests
  description: Concurrent cache misses for the same cache key make one upstream
    request; the other callers wait (up to 60 s) and share its result, and do
    not count against rate limits.
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
      - file: README.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
motivation.requirement.optional-secure-key-access-control:
  id: 46ed0e9c-98c4-4e9a-90ac-46fad2b8133d
  path: motivation.requirement.optional-secure-key-access-control
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Optional Secure Key Access Control
  description: When security.require_secure_key is set, every request must carry
    the proxy's secure key (generated as 256 random bits, or supplied as
    security.secure_key) as a path prefix, a ?key= query parameter, an
    X-API-Buddy-Key header or an Authorization Bearer token, else 401.
  attributes:
    requirementType: functional
    priority: high
  source_reference:
    provenance: manual
    locations:
      - file: documentation/01_poc/01.1_poc_requirements.md
  metadata:
    created_at: 2026-11-24T17:55:54.502Z
    updated_at: 2026-11-24T17:55:54.502Z
    version: 1
